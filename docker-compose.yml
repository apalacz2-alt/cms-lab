services:
  db:
    image: mariadb:11
    environment:
      MARIADB_DATABASE: wordpress
      MARIADB_USER: wp
      MARIADB_PASSWORD: wp_haslo_lab
      MARIADB_ROOT_PASSWORD: root_haslo_lab
    volumes: 
      - db:/var/lib/mysql
    restart: unless-stopped

  wordpress:
    image: wordpress:latest
    ports: 
      - "8080:80"
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_USER: wp
      WORDPRESS_DB_PASSWORD: wp_haslo_lab
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_HOME', 'https://' . getenv('CODESPACE_NAME') . '-8080.' . getenv('GITHUB_CODESPACES_PORT_FORWARDING_DOMAIN']);
        define('WP_SITEURL', 'https://' . getenv('CODESPACE_NAME') . '-8080.' . getenv('GITHUB_CODESPACES_PORT_FORWARDING_DOMAIN']);
        $_SERVER['HTTPS'] = 'on';
    depends_on:
      - db
    restart: unless-stopped

volumes:
  db:
